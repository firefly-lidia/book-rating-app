spring:
  datasource:
    url: jdbc:postgresql://localhost:32785/app?currentSchema=book_rating
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: book_rating
    default-schema: book_rating
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-test
    clean-disabled: false
    baseline-on-migrate: true
    placeholders:
      SCHEMA: book_rating
      APP_USER: book_app
      ADMIN_USER: book_admin
      APP_PASSWORD: app123
      ADMIN_PASSWORD: admin123
  jpa:
    properties:
      hibernate.default_schema: book_rating
  data:
    redis:
      url: redis://default:secret@localhost:6379/0

app:
  security:
    jwt:
      issuer: "book-rating-service"
      access-ttl: PT15M
      refresh-ttl: P14D
      private-pem-path: jwt-private.pem